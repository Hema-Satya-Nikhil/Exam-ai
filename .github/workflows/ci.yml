name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-only placeholders. Tests self-configure (SQLite in-memory/file-backed,
  # mocked LLM provider). No real secrets are used or echoed anywhere.
  APP_ENV: TEST
  NVIDIA_API_KEY: ci-placeholder-not-a-secret
  NVIDIA_MODEL: ci-test-model
  MONGODB_URI: mongodb://localhost:27017
  MONGODB_DATABASE: question_paper_generator_ci
  DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_placeholder
  SECRET_KEY: ci-only-not-a-real-secret
  ADMIN_EMAIL: ci@example.com
  ADMIN_PASSWORD: ci-only-placeholder

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run pytest
        run: |
          set -o pipefail
          uv run pytest -q --no-header 2>&1 | tee pytest-output.txt

      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: backend/pytest-output.txt
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (tests, typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Jest tests
        run: npm test -- --ci --runInBand

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Production build
        run: npm run build

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend/.next/**/*.log
          if-no-files-found: ignore
          retention-days: 7
