[project]
name = "question-paper-generator-backend"
version = "0.1.0"
description = "FastAPI backend for AI-based question paper generation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.31.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "email-validator>=2.2.0",
  "sqlalchemy>=2.0.35",
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "httpx>=0.27.2",
  "pymongo>=4.10.1",
  "python-multipart>=0.0.12",
  "PyMuPDF>=1.24.10",
  "python-docx>=1.1.2",
  "pypdf>=5.1.0",
  "Pillow>=10.4.0",
  "rapidocr-onnxruntime>=1.2.3",
  "reportlab>=4.2.2",
  "cryptography>=43.0.1",
  "passlib>=1.7.4",
  "bcrypt>=4.1.3,<5.0.0",
  "pyjwt>=2.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "aiosqlite>=0.20.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2"
]

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
